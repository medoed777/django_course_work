{% extends 'base.html' %}

{% block content %}
<div class="modal-body">
    <form method="post" enctype="multipart/form-data" action="{% url 'recipients:create_recipient' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="justify-content-end d-flex">
            <a class="btn btn-primary text-white cursor-pointer mx-2" href="{% url 'recipients:recipients' %}">Отмена</a>
            <button class="btn btn-primary text-white cursor-pointer" type="submit">Добавить</button>
        </div>
    </form>
</div>
{% endblock %}
