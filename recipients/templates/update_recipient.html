{% extends 'base.html' %}

{% block content %}
<div class="modal-header">
    <h5 class="modal-title">Редактировать получателя</h5>
</div>
<div class="modal-body">
    <form method="post" enctype="multipart/form-data" action="{% url 'recipients:create_recipient' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="justify-content-end d-flex">
            <button class="btn btn-primary text-white cursor-pointer" type="submit">Сохранить</button>
            <a class="btn btn-primary text-white cursor-pointer mx-2" href="{% url 'recipients:detail_recipient' recipient.pk %}">Отмена</a>

        </div>
    </form>
</div>
{% endblock %}
