{% extends 'base.html' %}

{% block content %}
<div class="modal-header d-flex justify-content-between align-items-center">
    <h5 class="modal-title mx-auto">Удаление сообщения</h5>

</div>
<div class="modal-body">
    <form method="post" enctype="multipart/form-data" action="{% url 'message:delete_message' object.pk %}">
        {% csrf_token %}
        <div class="d-flex justify-content-center">
            <a class="btn btn-primary text-white cursor-pointer mx-2" href="{% url 'message:message' %}">Отмена</a>
            <button class="btn btn-danger text-white cursor-pointer" type="submit">Удалить</button>
        </div>
    </form>
</div>
{% endblock %}
